server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Logo de empresa (máx. 2 MB) + margen.
  client_max_body_size 3m;

  # El API vive en el contenedor "backend"; mismo origen para que la cookie SameSite=Strict funcione.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos compilados con hash: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta desconocida devuelve index.html (React Router).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
